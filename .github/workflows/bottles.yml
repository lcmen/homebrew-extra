name: Bottles

on:
  pull_request:
    paths:
      - Formula/*.rb
      - .github/scripts/create-bottle.sh
      - .github/workflows/bottles.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish bottles and open a formula update PR (main branch only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bottles-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  bottle:
    name: ${{ matrix.package }} (${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - libvips-lite
        target:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.target.arch }}"

      - name: Tap repository
        run: brew tap lcmen/extra "$GITHUB_WORKSPACE"

      - name: Set bottle root URL
        id: bottle
        run: |
          pkg_version="$(
            brew info --json=v2 "lcmen/extra/${{ matrix.package }}" |
              jq --raw-output '
                .formulae[0] |
                if (.revision // 0) > 0
                then "\(.versions.stable)_\(.revision)"
                else .versions.stable
                end
              '
          )"
          echo "root_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ matrix.package }}-${pkg_version}" >> "$GITHUB_OUTPUT"

      - name: Create and test bottle
        run: >
          .github/scripts/create-bottle.sh
          "${{ matrix.package }}"
          "${{ steps.bottle.outputs.root_url }}"

      - name: Upload bottle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.package }}-${{ matrix.target.arch }}
          path: |
            ${{ matrix.package }}--*.bottle.tar.gz
            ${{ matrix.package }}-*.bottle.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish bottles
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish &&
      github.ref == 'refs/heads/main'
    needs: bottle
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Download bottle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bottle-*
          merge-multiple: true
          path: ${{ runner.temp }}/bottles

      - name: Tap repository
        run: brew tap lcmen/extra "$GITHUB_WORKSPACE"

      - name: Publish bottles and update formulas
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew pr-upload --no-commit
        working-directory: ${{ runner.temp }}/bottles

      - name: Create bottle metadata pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: publish-bottles
          delete-branch: true
          commit-message: Publish Homebrew bottles
          title: Publish Homebrew bottles
          body: |
            Publish macOS ARM64 and Intel bottles and update their formula metadata.

            Generated by GitHub Actions.
          labels: automated
