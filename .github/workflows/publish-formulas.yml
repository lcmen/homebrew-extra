name: Publish Formulas

on:
  push:
    branches:
      - main
    paths:
      - Formula/*.rb

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-formulas
  cancel-in-progress: false

jobs:
  publish-formulas:
    runs-on: macos-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Check formula metadata
        id: check
        run: |
          needs_update=false

          for formula_path in Formula/*.rb; do
            name="$(basename "$formula_path" .rb)"
            metadata_path="api/formula/${name}.json"
            expected_head="$(git log -1 --format=%H -- "$formula_path")"
            recorded_head="$(jq --raw-output '.tap_git_head // empty' "$metadata_path" 2>/dev/null || true)"

            if [[ "$recorded_head" != "$expected_head" ]]; then
              needs_update=true
              break
            fi
          done

          echo "needs_update=$needs_update" >> "$GITHUB_OUTPUT"

      - name: Tap repository
        if: steps.check.outputs.needs_update == 'true'
        run: brew tap lcmen/extra "$GITHUB_WORKSPACE"

      - name: Generate formula metadata
        if: steps.check.outputs.needs_update == 'true'
        run: .github/scripts/generate-formula-api.sh

      - name: Create pull request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: publish-formulas
          delete-branch: true
          commit-message: Update formula API metadata
          title: Update formula API metadata
          body: |
            Update Homebrew-compatible formula metadata after formula changes.

            🤖 Generated by GitHub Actions
          labels: automated
