name: Create Bottles and optionally publish

on:
  pull_request:
    paths:
      - Formula/libvips-lite.rb
      - .github/scripts/create-bottle.sh
      - .github/workflows/create-bottles.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish bottles and push updated formula metadata to main (main branch only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bottles-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  build-bottles:
    name: ${{ matrix.package }} (${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - libvips-lite
        target:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.target.arch }}"

      - name: Tap repository
        run: brew tap lcmen/extra "$GITHUB_WORKSPACE"

      - name: Set bottle root URL
        id: bottle
        run: |
          pkg_version="$(
            brew info --json=v2 "lcmen/extra/${{ matrix.package }}" |
              jq --raw-output '
                .formulae[0] |
                if (.revision // 0) > 0
                then "\(.versions.stable)_\(.revision)"
                else .versions.stable
                end
              '
          )"
          echo "root_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ matrix.package }}-${pkg_version}" >> "$GITHUB_OUTPUT"

      - name: Cache bottle
        id: bottle-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.package }}--*.bottle*.tar.gz
            ${{ matrix.package }}--*.bottle.json
          key: bottle-v1-${{ matrix.target.runner }}-${{ matrix.package }}-${{ hashFiles(format('Formula/{0}.rb', matrix.package), '.github/scripts/create-bottle.sh') }}

      - name: Create bottle
        if: steps.bottle-cache.outputs.cache-hit != 'true'
        run: .github/scripts/create-bottle.sh "${{ matrix.package }}" "${{ steps.bottle.outputs.root_url }}"

      - name: Upload bottle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.package }}-${{ matrix.target.arch }}
          path: |
            ${{ matrix.package }}--*.bottle*.tar.gz
            ${{ matrix.package }}--*.bottle.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish bottles
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build-bottles
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          # Pushing to a protected main needs the PAT; GITHUB_TOKEN is not an admin and would be rejected by the protection rule.
          token: ${{ secrets.PAT_TOKEN }}

      - name: Download bottle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bottle-*
          merge-multiple: true
          path: ${{ runner.temp }}/bottles

      - name: Tap repository
        run: |
          brew tap lcmen/extra "$GITHUB_WORKSPACE"
          brew trust --tap lcmen/extra

      - name: Publish bottles and update formulas
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew pr-upload --no-commit
          rsync -a "$(brew --repo lcmen/extra)/Formula/" "$GITHUB_WORKSPACE/Formula/"

          if git -C "$GITHUB_WORKSPACE" diff --quiet -- Formula; then
            echo "brew pr-upload did not update any formula metadata" >&2
            exit 1
          fi
        working-directory: ${{ runner.temp }}/bottles

      - name: Audit formulas
        run: .github/scripts/audit-formulas.sh

      - name: Push updated formulas to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          git commit --message "Publish Homebrew bottles"
          git pull --rebase origin main
          git push origin main
