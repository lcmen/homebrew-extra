name: Publish Formulas

on:
  push:
    branches:
      - main
    paths:
      - Formula/*.rb

permissions:
  contents: write

concurrency:
  group: publish-formulas
  cancel-in-progress: false

jobs:
  publish-formulas:
    runs-on: macos-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.PAT_TOKEN }}

      - name: Check formula metadata
        id: check
        run: |
          needs_update=false

          for formula_path in Formula/*.rb; do
            name="$(basename "$formula_path" .rb)"
            metadata_path="api/formula/${name}.json"
            expected_head="$(git log -1 --format=%H -- "$formula_path")"
            recorded_head="$(jq --raw-output '.tap_git_head // empty' "$metadata_path" 2>/dev/null || true)"

            if [[ "$recorded_head" != "$expected_head" ]]; then
              needs_update=true
              break
            fi
          done

          echo "needs_update=$needs_update" >> "$GITHUB_OUTPUT"

      - name: Tap repository
        if: steps.check.outputs.needs_update == 'true'
        run: brew tap lcmen/extra "$GITHUB_WORKSPACE"

      - name: Generate formula metadata
        if: steps.check.outputs.needs_update == 'true'
        run: .github/scripts/generate-formula-api.sh

      - name: Audit formulas
        if: steps.check.outputs.needs_update == 'true'
        run: .github/scripts/audit-formulas.sh

      - name: Push formula metadata to main
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api

          if git diff --staged --quiet; then
            echo "Formula metadata is already up to date"
            exit 0
          fi

          git commit --message "Update formula API metadata"
          git pull --rebase origin main
          git push origin main
