name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tap repository
        run: brew tap lcmen/extra "$GITHUB_WORKSPACE"

      - name: Audit formulas
        run: .github/scripts/audit-formulas.sh
